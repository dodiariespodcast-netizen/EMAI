name: Publish container image

# Builds the deployable image and pushes it to this repo's GitHub Container
# Registry, so hosting it is "point a platform at a published image" rather
# than "build it yourself". Uses the repo's own GITHUB_TOKEN -- no secrets to
# configure.
#
# After the first successful run the image is at:
#   ghcr.io/<owner>/<repo>:latest
# GHCR packages start out private; make it public from the package's settings
# page if you want a host to pull it without credentials.

on:
  push:
    branches: ["main", "master", "claude/**"]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Build and push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summarize how to run it
        run: |
          {
            echo "### Image published"
            echo
            echo '```bash'
            echo "docker run -p 8000:8000 \\"
            echo "  -e SECRET_KEY=\$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))') \\"
            echo "  -e DATABASE_URL=postgres://user:pass@host:5432/db \\"
            echo "  -e PUBLIC_BASE_URL=https://your-domain.com \\"
            echo "  ghcr.io/${{ github.repository }}:latest"
            echo '```'
            echo
            echo "Tags: ${{ steps.meta.outputs.tags }}"
          } >> "$GITHUB_STEP_SUMMARY"
