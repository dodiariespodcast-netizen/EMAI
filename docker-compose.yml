# The whole product, one command:
#
#   cp .env.example .env      # then edit SECRET_KEY at minimum
#   docker compose up --build
#   docker compose run --rm api python -m app.seed   # optional demo data
#
# Then open http://localhost:5173 (app) and http://localhost:8000/docs (API).

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-emai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-emai}
      POSTGRES_DB: ${POSTGRES_DB:-emai_scheduler}
    volumes:
      - emai_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-emai}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-emai}:${POSTGRES_PASSWORD:-emai}@db:5432/${POSTGRES_DB:-emai_scheduler}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env -- see .env.example for how to generate one}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Where the frontend lives, for links in invite/reset emails.
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:5173}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:5173"]}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-no-reply@example.com}
    ports:
      - "${API_PORT:-8000}:8000"
    # Migrations run on boot so a fresh volume comes up with the current
    # schema; the app's own create_all is only a dev fallback.
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health/ready').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        # Baked into the bundle at build time -- this is the URL the browser
        # uses, so it must be reachable from the browser, not from inside the
        # compose network.
        VITE_API_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
        VITE_MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-5173}:80"
    restart: unless-stopped

volumes:
  emai_pg_data:
