# The whole product, one command:
#
#   cp .env.example .env      # then set SECRET_KEY
#   docker compose up --build
#   docker compose exec app python -m app.seed    # optional demo data
#
# Then open http://localhost:8000 -- the API serves the app from the same
# origin, so there's one URL, no CORS to configure, and nothing baked into
# the frontend bundle.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-emai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-emai}
      POSTGRES_DB: ${POSTGRES_DB:-emai_scheduler}
    volumes:
      - emai_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-emai}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build:
      context: .
      args:
        GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
        MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-emai}:${POSTGRES_PASSWORD:-emai}@db:5432/${POSTGRES_DB:-emai_scheduler}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env -- see .env.example for how to generate one}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # One origin serves both the app and the API, so this is the only URL
      # that needs configuring and CORS can stay closed.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
      CORS_ORIGINS: ${CORS_ORIGINS:-[]}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-no-reply@example.com}
    ports:
      - "${APP_PORT:-8000}:8000"
    restart: unless-stopped

volumes:
  emai_pg_data:
